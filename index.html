const sheets={rules:{en:{eyebrow:"HOUSE RULES",title:"A few simple rules",body:"Everything you need for a smooth and respectful stay.",list:["No smoking inside the room.","Quiet hours: 23:00–08:00.","No parties or unregistered guests.","Check-out by 11:00."]},gr:{eyebrow:"ΚΑΝΟΝΕΣ",title:"Μερικοί απλοί κανόνες",body:"Ό,τι χρειάζεται για μια άνετη και ήρεμη διαμονή.",list:["Απαγορεύεται το κάπνισμα μέσα στο δωμάτιο.","Ώρες κοινής ησυχίας: 23:00–08:00.","Δεν επιτρέπονται πάρτι ή μη δηλωμένοι επισκέπτες.","Check-out έως τις 11:00."]}},manual:{en:{eyebrow:"HOUSE MANUAL",title:"Everything in one place",body:"Quick instructions for the things you are most likely to need.",rows:[["Wi-Fi","MarysRoom_5G"],["Password","welcome2026"],["A/C","Set COOL at 23°C"],["Hot water","Always available"]]},gr:{eyebrow:"ΟΔΗΓΟΣ ΣΠΙΤΙΟΥ",title:"Όλα σε ένα σημείο",body:"Γρήγορες οδηγίες για όσα είναι πιο πιθανό να χρειαστείς.",rows:[["Wi-Fi","MarysRoom_5G"],["Κωδικός","welcome2026"],["A/C","COOL στους 23°C"],["Ζεστό νερό","Πάντα διαθέσιμο"]]}},transfer:{en:{eyebrow:"TRANSFER",title:"Need a ride?",body:"For this demo, the guest can quickly see the property’s transfer instructions or contact the host to arrange a ride.",actions:["Ask the host"]},gr:{eyebrow:"ΜΕΤΑΦΟΡΑ",title:"Χρειάζεσαι διαδρομή;",body:"Στο demo ο επισκέπτης βλέπει άμεσα τις οδηγίες μεταφοράς ή επικοινωνεί με τον host για να κανονίσει διαδρομή.",actions:["Ρώτησε τον host"]}},contact:{en:{eyebrow:"CONTACT",title:"We’re here if you need us",body:"Use your Airbnb conversation for the fastest response during the stay.",actions:["Open Airbnb conversation","Copy host contact"]},gr:{eyebrow:"ΕΠΙΚΟΙΝΩΝΙΑ",title:"Είμαστε εδώ αν μας χρειαστείς",body:"Χρησιμοποίησε τη συνομιλία της Airbnb για την πιο γρήγορη απάντηση.",actions:["Άνοιγμα συνομιλίας Airbnb","Αντιγραφή επικοινωνίας"]}},review:{en:{eyebrow:"REVIEW",title:"How is your first impression?",body:"This is a demo of the Zisto review flow. In production, the final action can send the guest to the property’s Google Review page."},gr:{eyebrow:"ΑΞΙΟΛΟΓΗΣΗ",title:"Πώς είναι η πρώτη σου εντύπωση;",body:"Αυτό είναι demo του review flow του Zisto. Στην κανονική έκδοση, το τελικό κουμπί μπορεί να οδηγεί στο Google Review του καταλύματος."}}};
let lang="en",activeSheet=null,rating=0;const languageToggle=document.getElementById("languageToggle"),backdrop=document.getElementById("sheetBackdrop"),sheetContent=document.getElementById("sheetContent"),sheetClose=document.getElementById("sheetClose"),toast=document.getElementById("toast");
function track(event,payload={}){window.zistoDemoEvents=window.zistoDemoEvents||[];window.zistoDemoEvents.push({event,payload,at:new Date().toISOString()})}
function showToast(message){toast.textContent=message;toast.classList.add("show");clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>toast.classList.remove("show"),1500)}
function applyLanguage(){document.documentElement.lang=lang==="en"?"en":"el";document.querySelectorAll("[data-i18n]").forEach(el=>{const key=el.dataset.i18n,value=copy[lang][key];key==="welcome"?el.innerHTML=value:el.textContent=value});languageToggle.textContent=lang==="en"?"EN · GR":"GR · EN";if(activeSheet)renderSheet(activeSheet)}
const listMarkup=items=>`<ul class="sheet-list">${items.map(item=>`<li>${item}</li>`).join("")}</ul>`;
const rowsMarkup=rows=>rows.map(([label,value])=>`<div class="info-row"><span>${label}</span><strong>${value}</strong></div>`).join("");
const actionsMarkup=actions=>`<div class="sheet-actions">${actions.map((label,i)=>`<button type="button" class="sheet-action ${i?"secondary":""}" data-demo-action="${label}">${label}</button>`).join("")}</div>`;
function renderSheet(type){const data=sheets[type][lang];let extra="";if(data.list)extra+=listMarkup(data.list);if(data.rows)extra+=rowsMarkup(data.rows);if(data.actions)extra+=actionsMarkup(data.actions);if(type==="review"){const starLabel=lang==="en"?"Select rating":"Επίλεξε βαθμολογία",buttonLabel=lang==="en"?"Continue to Google Review":"Συνέχεια στο Google Review";extra+=`<div class="stars" aria-label="${starLabel}">${[1,2,3,4,5].map(n=>`<button type="button" class="star ${n<=rating?"active":""}" data-rating="${n}" aria-label="${n} stars">★</button>`).join("")}</div><button type="button" class="sheet-action" data-demo-action="review">${buttonLabel}</button>`}sheetContent.innerHTML=`<p class="sheet-eyebrow">${data.eyebrow}</p><h2 id="sheetTitle">${data.title}</h2><p>${data.body}</p>${extra}`;sheetContent.querySelectorAll("[data-demo-action]").forEach(button=>button.addEventListener("click",()=>{track("demo_action",{sheet:type,action:button.dataset.demoAction});showToast(lang==="en"?"Demo action recorded":"Η ενέργεια καταγράφηκε στο demo")}));sheetContent.querySelectorAll("[data-rating]").forEach(button=>button.addEventListener("click",()=>{rating=Number(button.dataset.rating);track("review_rating",{rating});renderSheet("review")}))}
function openSheet(type){activeSheet=type;renderSheet(type);backdrop.hidden=false;document.body.style.overflow="hidden";track("open_section",{section:type});requestAnimationFrame(()=>sheetClose.focus())}
function closeSheet(){backdrop.hidden=true;document.body.style.overflow="";activeSheet=null}
languageToggle.addEventListener("click",()=>{lang=lang==="en"?"gr":"en";track("language_change",{language:lang});applyLanguage()});document.querySelectorAll("[data-sheet]").forEach(button=>button.addEventListener("click",()=>openSheet(button.dataset.sheet)));sheetClose.addEventListener("click",closeSheet);backdrop.addEventListener("click",event=>{if(event.target===backdrop)closeSheet()});document.addEventListener("keydown",event=>{if(event.key==="Escape"&&!backdrop.hidden)closeSheet()});if("scrollRestoration" in history)history.scrollRestoration="manual";window.scrollTo(0,0);applyLanguage();track("smart_link_open");
</script>
